appId: com.shiftword.app
productName: Shiftword
# No `license` key: electron-builder rejects it and picks the root LICENSE file
# up automatically for the NSIS licence page.
directories:
  output: dist
  # `build/icon.ico`, `build/icon.png` and `build/icons/*.png` are generated by
  # `python scripts/make-icon.py` (Pillow) and are what the installers, the
  # taskbar and the DE file manager show.
  buildResources: build
files:
  - out/**
  - package.json
artifactName: ${name}-${version}-${os}-${arch}.${ext}
win:
  target:
    - nsis
  # PNG is accepted (>= 256 px); electron-builder converts it to .ico.
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  # Unsigned build (no code-signing certificate configured).
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  icon: build/icon.png
linux:
  target:
    - AppImage
    - deb
  category: Office
  maintainer: Shiftword
  synopsis: Shiftword — offline Word-like document editor
  description: A free, offline, cross-platform Word-like document editor.
  # A directory of {16,24,...,512}.png gives the DE a crisp icon at every size
  # instead of one upscaled bitmap.
  icon: build/icons
